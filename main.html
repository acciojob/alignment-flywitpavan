<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Assignment 3</title>

    <style>
        table {
            border: 1px solid black;
            border-spacing: 1px;
        }
        td {
            border: 1px solid black;
            padding: 1px;
        }
        .middle {
            margin: auto;
        }
        .center {
            text-align: center;
        }
        .right {
            text-align: right;
        }
        .green {
            background-color: green;
        }
        .blue {
            background-color: blue;
        }
    </style>
</head>

<body>

    <!-- Heading -->
    <h1 style="text-align:center;">HTML Assignment #3</h1>

    <!-- Table 1 -->
    <table id="table-1" class="middle">
        <tr>
            <td id="t11">Row 1 Col 1</td>
            <td id="t12">Row 1 Col 2</td>
            <td id="t13" class="right">Row 1 Col 3</td>
        </tr>
        <tr class="center">
            <td>Row 2 Col 1</td>
            <td>Row 2 Col 2</td>
            <td class="right">Row 2 Col 3</td>
        </tr>
        <tr>
            <td>Row 3 Col 1</td>
            <td>Row 3 Col 2</td>
            <td class="right">Row 3 Col 3</td>
        </tr>
    </table>

    <br><br>

    <!-- Table 2 -->
    <table id="table-2" class="middle">
        <tr>
            <td id="t21" colspan="6" class="center">Table 2 - First Row (Colspan 6)</td>
        </tr>
        <tr>
            <td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td>
        </tr>
        <tr>

        <tr>
            <td>19</td><td>20</td><td>21</td><td>22</td><td>23</td><td>24</td>
        </tr>
        <tr>
            <td>25</td><td>26</td><td>27</td><td>28</td><td>29</td><td>30</td>
        </tr>
    </table>

    <br><br>

    <!-- Table 3 -->
    <table id="table-3" class="middle">
        <tr class="green">
            <td>Green Row</td>
        </tr>
        <tr>
            <td id="t-image" class="center">
                <img src="https://www2.d125.org/applied_arts/teched/courses/WEB/portfolios/2013_FallP3/Luthra%20Portfolio/images-1.jpeg" alt="Sample Image">
            </td>
        </tr>
        <tr class="blue">
            <td>Blue Row</td>
        </tr>

</body>
</html>
